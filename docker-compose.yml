services:
  newsroom:
    build: .
    container_name: genil-newsroom
    restart: unless-stopped
    env_file: .env
    ports:
      # So localhost: quem expoe para a internet com HTTPS e o proxy reverso.
      - "127.0.0.1:${PORTA:-3000}:3000"
    environment:
      PORTA: 3000
    volumes:
      # A sessao do WhatsApp mora aqui. Apagar este volume = parear de novo.
      - ./data:/app/data
      # O manual de redacao fica editavel sem rebuild da imagem.
      - ./editorial:/app/editorial:ro
      # Só usado quando PUBLICADOR=markdown.
      - ./saida:/app/saida
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/saude').then(r=>process.exit(r.status===401||r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3
